[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-server"
version = "0.1.0"
description = "Unified LLM server with intelligent model-based routing. Optimized for Apple Silicon (M1/M2/M3) with MLX backend support."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Alex Afflerbach" }
]

dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "protobuf>=6.33.5",  # CVE-2025-4565 fixed in 6.31.1; CVE-2026-0994 (JSON recursion bypass) fixed in 6.33.5
    "structlog>=24.0.0",
    "typer>=0.12.0",  # CLI framework for benchmark_models.py
    "rich>=13.0.0",  # Rich terminal output for benchmark_models.py
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
]

# Backend inference servers (install only what you need)
mlx = [
    "mlx-openai-server>=1.7.1",
    "mlx-lm>=0.31.2; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3; sys_platform != 'darwin'",
]

llamacpp = [
    "llama-cpp-python[server]>=0.3.20",
]

[tool.uv]
# MLX stack still pulls prerelease pins transitively in some versions
prerelease = "allow"
override-dependencies = [
    # mlx-openai-server caps fastapi<0.130 / python-multipart<0.0.25, transitively pinning
    # starlette<1.0.0 below its security-patched 1.x. Force the patched floors (Dependabot
    # alerts #32/34/35/36/37/48/49/50/51). mlx backend runs as a localhost subprocess; verified
    # it still imports under fastapi 0.13x / starlette 1.x.
    "fastapi>=0.130.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    # mlx-openai-server 1.8.1 (latest, 2026-05-03) caps json_repair<0.60 but never imports it:
    # no module in the installed environment imports json_repair. Force the patched floor
    # (Dependabot alert #54, GHSA-xf7x-x43h-rpqh, circular $ref CPU DoS).
    "json-repair>=0.60.1",
]
constraint-dependencies = [
    "requests>=2.33.0",   # GHSA-gc5v-m9x4-r6x2 (transitive via outlines / mlx stack)
    "aiohttp>=3.14.3",    # 20+ CVEs in <=3.13.3 and <=3.14.0; GHSA-mq44-7p77-q5h7, GHSA-mfx4-hv73-q22v (<=3.14.1); GHSA-cq5v-8q36-5273 (<=3.14.2) (transitive via fsspec / mlx stack)
    "pygments>=2.20.0",  # GHSA-hmwr-4x9x-jgrw ReDoS in GUID regex (transitive via rich)
    "idna>=3.15",        # CVE-2024-3651 follow-on: idna.encode() bypass (transitive via httpx/requests)
    "anyio>=4.14.2",     # GHSA-82r6-8w77-94w6 TLSStream IDNA 2003 host encoding, GHSA-5p39-cfhj-2xmp (transitive via httpx/starlette/uvicorn; core path)
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww, GHSA-m2h6-j472-rp4c (transitive via secretstorage; Linux only, not installed on macOS)
    "pillow>=12.3.0",    # 13 advisories <12.3.0: heap OOB writes, decompression-bomb bypasses, DoS (transitive via mlx stack)
    "transformers>=5.10.0",  # GHSA-xrqw-3rrv-vx5w save_pretrained path traversal via chat template names (transitive via mlx-lm)
    "torch>=2.13.0",     # GHSA-rrmf-rvhw-rf47 torch.jit.script memory corruption (transitive via mlx stack)
    "setuptools>=83.0.0",  # GHSA-h35f-9h28-mq5c sdist MANIFEST.in exclusion bypass on APFS (transitive via torch)
    # fastapi / starlette / python-multipart patched floors are forced via override-dependencies above
    # (mlx-openai-server's fastapi<0.130 cap is conservative; the mlx backend still imports and builds
    # its FastAPI app under the forced stack). Drop the overrides once mlx-openai-server raises its bound.
    # diskcache<=5.6.3 has unsafe pickle deserialization (GHSA-7gh8-9274-8555); no upstream patch yet.
    # Risk is low for local-only deployments. Track: https://github.com/grantjenks/python-diskcache/issues
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
